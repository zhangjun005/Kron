[package]
name = "kron"
version = "0.1.0"
edition = "2024"
description = "Git-native task tracker for AI-assisted development"
license = "MIT"
repository = "https://github.com/zhangjun005/Kron"
readme = "README.md"

[[bin]]
name = "kron"
path = "src/main.rs"

[lib]
name = "kron"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Errors
thiserror = "1.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.10"
