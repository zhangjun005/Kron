<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kron logo — v2 linear</title>
    <style>
      :root { color-scheme: dark; --ink: #f4f4f0; --paper: #101010; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { display: grid; min-height: 100svh; place-items: center; padding: 2rem; background: #101010; color: var(--ink); font-family: Arial, sans-serif; }
      .stage { display: grid; gap: 1.25rem; justify-items: center; }
      .logo { display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); width: min(78vw, 30rem); aspect-ratio: 1; }
      .cell { display: grid; place-items: center; background: var(--paper); color: var(--ink); }
      .cell--inverse { background: var(--ink); color: var(--paper); }
      svg { width: 100%; height: 100%; overflow: visible; }
      path, circle { fill: none; stroke: currentColor; stroke-width: 11; stroke-linecap: square; stroke-linejoin: miter; vector-effect: non-scaling-stroke; }
      .caption { margin: 0; color: #999; font-size: .7rem; letter-spacing: .28em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Kron logo v2 linear">
      <div class="logo" role="img" aria-label="Kron logo v2: linear K R O N">
        <span class="cell"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M18 10v80M18 50h22M40 50L84 10M40 50l44 40" /></svg></span>
        <span class="cell"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M18 90V10h35c18 0 27 9 27 22s-9 22-27 22H18M53 54l29 36" /></svg></span>
        <span class="cell"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><circle cx="50" cy="50" r="35" /></svg></span>
        <span class="cell cell--inverse"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M18 90V10l64 80V10M18 90h64" /></svg></span>
      </div>
      <p class="caption">Kron / v2 linear</p>
    </main>
  </body>
</html>
